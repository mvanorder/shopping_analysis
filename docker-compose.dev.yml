# Dev: plain password via env file, port published to the host so local
# tools (psql, DBeaver, etc.) can connect directly, disposable volume.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    restart: "no"

  backend:
    env_file:
      - .env.dev
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: "no"

volumes:
  db-data-dev:

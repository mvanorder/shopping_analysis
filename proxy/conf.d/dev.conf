# Dev server block (proxy/Dockerfile `dev` target).
#
# The browser hits this proxy on :8080. Backend routes go to the `backend`
# container; everything else is forwarded to the Expo web dev server in the
# `frontend` container (`expo start`) so hot reload and the Metro HMR
# websocket keep working. Nothing is served from disk here — contrast
# conf.d/static.conf, which is baked for staging/prod.

# Metro upgrades the HMR connection to a websocket; pass the hop-by-hop
# headers through. `map` is valid here because conf.d/*.conf is included
# inside the stock nginx.conf's `http {}` block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;

    # Docker's embedded DNS. Lets the proxy_pass targets below resolve lazily
    # per-request (see snippets/proxy_backend.conf) so this container starts
    # even when `backend`/`frontend` aren't up yet.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # /orders/upload takes a whole CSV export in the request body.
    client_max_body_size 25m;

    # This proxy's own liveness endpoint. The Chainguard nginx runtime is
    # distroless (no curl/wget/shell), so a compose HEALTHCHECK can't probe
    # it from inside the container — this is here for an external check
    # (a load balancer, `curl` from the host, an uptime monitor).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/backend_routes.conf;

    # Expo web dev server (Metro). Must be reachable as `frontend:8081` on the
    # compose network — the frontend container runs `expo start --host lan` so
    # Metro binds all interfaces.
    location / {
        set $frontend_upstream http://frontend:8081;
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Long timeout so an idle HMR websocket isn't culled mid-session.
        proxy_read_timeout 3600s;
    }
}

# Staging/prod server block (proxy/Dockerfile `static` target, the default).
#
# The Expo web export built in the `web-build` stage is baked into this image
# at /usr/share/nginx/html and served straight from disk. Backend routes are
# still reverse-proxied to the `backend` container — never served or cached
# here.

server {
    listen 8080 default_server;
    server_name _;

    # Docker's embedded DNS. Lets the backend proxy_pass resolve lazily
    # per-request (see snippets/proxy_backend.conf) so this container starts
    # even when `backend` isn't up yet.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # /orders/upload takes a whole CSV export in the request body.
    client_max_body_size 25m;

    root /usr/share/nginx/html;

    # This proxy's own liveness endpoint. The Chainguard nginx runtime is
    # distroless (no curl/wget/shell), so a compose HEALTHCHECK can't probe it
    # from inside — this is for an external check (the TLS-terminating reverse
    # proxy in front, a load balancer, an uptime monitor).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/backend_routes.conf;

    # Content-hashed bundles and assets — safe to cache hard.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Expo Router static export: one HTML file per route. Try the exact path,
    # then `<route>.html`, then a directory index, then fall back to the app
    # shell so a hard refresh on a client-side route still boots.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# Shared directives for every location that reverse-proxies to the FastAPI
# backend. Included verbatim from both conf.d/dev.conf and conf.d/static.conf
# so the two configs can never drift on how the backend is proxied.
#
# The upstream host is passed through a variable so nginx resolves `backend`
# lazily (via the `resolver` set in the enclosing server block) on each
# request, instead of once at startup. That means the proxy starts and passes
# `nginx -t` even when the backend container is down, and picks up a new
# backend IP after a restart without needing a reload.
set $backend_upstream http://backend:8000;
proxy_pass                          $backend_upstream$request_uri;
proxy_http_version                  1.1;
proxy_set_header  Host              $host;
proxy_set_header  X-Real-IP         $remote_addr;
proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto $scheme;
proxy_connect_timeout               5s;
proxy_read_timeout                  60s;

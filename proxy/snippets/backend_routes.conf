# The backend's top-level route groups (see backend/app/main.py:
# /auth, /users, /orders, /health, plus FastAPI's own docs). Every one is
# reverse-proxied to the backend in every environment — this file is included
# inside the `server {}` block of both conf.d/dev.conf and conf.d/static.conf.
#
# When the backend grows a new top-level path, add it here.

location /auth/          { include /etc/nginx/snippets/proxy_backend.conf; }
location /users/         { include /etc/nginx/snippets/proxy_backend.conf; }
location /orders/        { include /etc/nginx/snippets/proxy_backend.conf; }
location /health         { include /etc/nginx/snippets/proxy_backend.conf; }

# FastAPI interactive docs / schema.
location /docs           { include /etc/nginx/snippets/proxy_backend.conf; }
location /redoc          { include /etc/nginx/snippets/proxy_backend.conf; }
location = /openapi.json { include /etc/nginx/snippets/proxy_backend.conf; }

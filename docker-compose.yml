# Base service definition shared by every environment. Never run alone —
# combine with one env override, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    build:
      context: ./database
    image: shopping-analysis-db:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopping}
      POSTGRES_DB: ${POSTGRES_DB:-shopping}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-shopping}", "-d", "${POSTGRES_DB:-shopping}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopping-analysis

  backend:
    build:
      context: ./backend
    image: shopping-analysis-backend:local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopping-analysis

networks:
  shopping-analysis:
    driver: bridge

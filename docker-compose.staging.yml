# Staging: mirrors prod's secret handling and network isolation so it
# actually catches deployment issues before they hit prod. No host port —
# only reachable from other containers on the shopping-analysis network.
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
services:
  db:
    env_file:
      - .env.staging
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db-data-staging:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

secrets:
  postgres_password:
    file: ./secrets/postgres_password_staging.txt

volumes:
  db-data-staging:
